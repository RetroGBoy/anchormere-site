name: Daily news digest

on:
  schedule:
    # 01:00 UTC daily (~09:00 Beijing). GitHub may delay on the shared runner.
    - cron: "0 1 * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily digest
        env:
          TRANSLATE_KEY: ${{ secrets.TRANSLATE_KEY }}
        run: python3 scripts/news_digest.py

      # Generators now emit the final normalized state themselves, so this step
      # is an idempotent fallback: it writes 0 files when nothing drifted.
      - name: Normalize (idempotent fallback)
        run: python3 scripts/site_normalize.py

      # Brand-domain text is a site-wide invariant (verify_seo.py 4f, pages=[*]):
      # every *.html must carry the static footer link to https://anchormere.com/.
      # news_digest.py renders its own footer, so newly generated news posts have
      # no domain block until this idempotent injector runs. Must be BEFORE the
      # verification gate and sitemap rebuild; writes 0 files when already clean.
      - name: Inject brand domain text (idempotent)
        run: python3 scripts/inject_social_domains.py

      - name: Rebuild sitemap (lastmod from real page content dates)
        run: python3 scripts/build_sitemap.py

      # Incremental gate: only modules dirtied by today's digest are verified,
      # plus the cheap site-wide invariants. A FAIL blocks the auto-commit.
      - name: Incremental verification gate
        run: python3 scripts/workarea.py verify --gate

      - name: Refresh module hash baseline (no-op when nothing changed)
        run: python3 scripts/workarea.py init

      - name: Audit module registry coverage
        run: python3 scripts/workarea.py audit

      - name: Commit and push (only if bytes actually changed)
        run: |
          git config user.name "Anchormere Bot"
          git config user.email "ops@anchormere.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new digest items today — no writes, no commit, no redeploy."
          else
            git commit -m "auto: daily news digest $(date -u +%F)"
            git push
          fi
